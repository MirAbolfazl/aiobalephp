{
    "openapi": "3.0.3",
    "info": {
        "title": "Aiobale PHP SDK",
        "version": "1.0.0",
        "description": "Async PHP client for the Bale messaging API. This OpenAPI document describes selected public flows. The complete generated RPC registry, including every request field, protobuf alias, service, and response model, is available in rpc-reference.md.",
        "license": {
            "name": "MIT",
            "url": "https://opensource.org/licenses/MIT"
        }
    },
    "servers": [
        {
            "url": "https://next-ws.bale.ai",
            "description": "Bale API gateway"
        }
    ],
    "externalDocs": {
        "description": "Complete reference for all registered RPC methods.",
        "url": "rpc-reference.md"
    },
    "tags": [
        {
            "name": "Auth",
            "description": "Phone authentication, validation, and session management."
        },
        {
            "name": "Messaging",
            "description": "Sending, reading, updating, and deleting messages."
        },
        {
            "name": "Users",
            "description": "Contacts and user profile operations."
        },
        {
            "name": "Files",
            "description": "File upload URL and transfer handling."
        },
        {
            "name": "Groups",
            "description": "Group and channel management."
        }
    ],
    "paths": {
        "/auth/start_phone_auth": {
            "post": {
                "tags": [
                    "Auth"
                ],
                "summary": "Start phone authentication",
                "description": "Starts the phone verification flow and returns a transaction hash for code verification.",
                "requestBody": {
                    "required": true,
                    "content": {
                        "application/json": {
                            "schema": {
                                "$ref": "#/components/schemas/StartPhoneAuthRequest"
                            }
                        }
                    }
                },
                "responses": {
                    "200": {
                        "description": "Challenge generated successfully",
                        "content": {
                            "application/json": {
                                "schema": {
                                    "$ref": "#/components/schemas/PhoneAuthChallenge"
                                }
                            }
                        }
                    },
                    "400": {
                        "$ref": "#/components/responses/BadRequest"
                    }
                }
            }
        },
        "/auth/validate_code": {
            "post": {
                "tags": [
                    "Auth"
                ],
                "summary": "Validate confirmation code",
                "description": "Validates the SMS or call code and completes the first stage of the authentication flow.",
                "requestBody": {
                    "required": true,
                    "content": {
                        "application/json": {
                            "schema": {
                                "$ref": "#/components/schemas/ValidateCodeRequest"
                            }
                        }
                    }
                },
                "responses": {
                    "200": {
                        "description": "Authentication succeeded or a password challenge is required",
                        "content": {
                            "application/json": {
                                "schema": {
                                    "$ref": "#/components/schemas/AuthResult"
                                }
                            }
                        }
                    },
                    "401": {
                        "$ref": "#/components/responses/Unauthorized"
                    }
                }
            }
        },
        "/auth/validate_password": {
            "post": {
                "tags": [
                    "Auth"
                ],
                "summary": "Validate second-factor password",
                "description": "Validates the account password when Bale requires a second factor.",
                "requestBody": {
                    "required": true,
                    "content": {
                        "application/json": {
                            "schema": {
                                "$ref": "#/components/schemas/ValidatePasswordRequest"
                            }
                        }
                    }
                },
                "responses": {
                    "200": {
                        "description": "Authenticated session created",
                        "content": {
                            "application/json": {
                                "schema": {
                                    "$ref": "#/components/schemas/AuthResult"
                                }
                            }
                        }
                    },
                    "401": {
                        "$ref": "#/components/responses/Unauthorized"
                    }
                }
            }
        },
        "/messaging/send_message": {
            "post": {
                "tags": [
                    "Messaging"
                ],
                "summary": "Send a message",
                "description": "Sends a text or media message to a target Bale peer.",
                "requestBody": {
                    "required": true,
                    "content": {
                        "application/json": {
                            "schema": {
                                "$ref": "#/components/schemas/SendMessageRequest"
                            }
                        }
                    }
                },
                "responses": {
                    "200": {
                        "description": "Message sent",
                        "content": {
                            "application/json": {
                                "schema": {
                                    "$ref": "#/components/schemas/MessageResponse"
                                }
                            }
                        }
                    }
                }
            }
        },
        "/messaging/load_history": {
            "post": {
                "tags": [
                    "Messaging"
                ],
                "summary": "Load chat history",
                "description": "Loads recent messages from a selected peer or chat.",
                "requestBody": {
                    "required": true,
                    "content": {
                        "application/json": {
                            "schema": {
                                "$ref": "#/components/schemas/LoadHistoryRequest"
                            }
                        }
                    }
                },
                "responses": {
                    "200": {
                        "description": "Message history returned",
                        "content": {
                            "application/json": {
                                "schema": {
                                    "$ref": "#/components/schemas/HistoryResponse"
                                }
                            }
                        }
                    }
                }
            }
        },
        "/files/get_file_upload_url": {
            "post": {
                "tags": [
                    "Files"
                ],
                "summary": "Get file upload URL",
                "description": "Requests upload metadata and a file target URL for large media payloads.",
                "requestBody": {
                    "required": true,
                    "content": {
                        "application/json": {
                            "schema": {
                                "$ref": "#/components/schemas/FileUploadRequest"
                            }
                        }
                    }
                },
                "responses": {
                    "200": {
                        "description": "Upload metadata returned",
                        "content": {
                            "application/json": {
                                "schema": {
                                    "$ref": "#/components/schemas/FileUploadInfo"
                                }
                            }
                        }
                    }
                }
            }
        }
    },
    "components": {
        "responses": {
            "BadRequest": {
                "description": "Invalid request payload",
                "content": {
                    "application/json": {
                        "schema": {
                            "$ref": "#/components/schemas/ErrorResponse"
                        }
                    }
                }
            },
            "Unauthorized": {
                "description": "Authentication is required or the token is invalid",
                "content": {
                    "application/json": {
                        "schema": {
                            "$ref": "#/components/schemas/ErrorResponse"
                        }
                    }
                }
            }
        },
        "schemas": {
            "ErrorResponse": {
                "type": "object",
                "properties": {
                    "error": {
                        "type": "string"
                    },
                    "topic": {
                        "type": "integer",
                        "nullable": true
                    }
                }
            },
            "StartPhoneAuthRequest": {
                "type": "object",
                "required": [
                    "phone_number",
                    "app_id",
                    "app_key"
                ],
                "properties": {
                    "phone_number": {
                        "type": "string",
                        "example": "+989123456789"
                    },
                    "app_id": {
                        "type": "integer",
                        "example": 4
                    },
                    "app_key": {
                        "type": "string",
                        "example": "C28D46DC4C3A7A26564BFCC48B929086A95C93C98E789A19847BEE8627DE4E7D"
                    },
                    "device_hash": {
                        "type": "string",
                        "nullable": true
                    },
                    "device_title": {
                        "type": "string"
                    },
                    "send_code_type": {
                        "type": "string",
                        "enum": [
                            "DEFAULT",
                            "SMS",
                            "CALL",
                            "BALEONLY"
                        ]
                    }
                }
            },
            "PhoneAuthChallenge": {
                "type": "object",
                "properties": {
                    "transaction_hash": {
                        "type": "string"
                    },
                    "code_timeout": {
                        "type": "integer"
                    },
                    "sent_code_type": {
                        "type": "string"
                    },
                    "next_send_code_type": {
                        "type": "string",
                        "nullable": true
                    }
                }
            },
            "ValidateCodeRequest": {
                "type": "object",
                "required": [
                    "code",
                    "transaction_hash"
                ],
                "properties": {
                    "code": {
                        "type": "string"
                    },
                    "transaction_hash": {
                        "type": "string"
                    }
                }
            },
            "ValidatePasswordRequest": {
                "type": "object",
                "required": [
                    "password",
                    "transaction_hash"
                ],
                "properties": {
                    "password": {
                        "type": "string",
                        "format": "password"
                    },
                    "transaction_hash": {
                        "type": "string"
                    }
                }
            },
            "AuthResult": {
                "type": "object",
                "properties": {
                    "token": {
                        "type": "string",
                        "nullable": true
                    },
                    "user": {
                        "$ref": "#/components/schemas/User"
                    }
                }
            },
            "User": {
                "type": "object",
                "properties": {
                    "id": {
                        "type": "integer"
                    },
                    "name": {
                        "type": "string"
                    },
                    "username": {
                        "type": "string",
                        "nullable": true
                    }
                }
            },
            "SendMessageRequest": {
                "type": "object",
                "required": [
                    "peer",
                    "text"
                ],
                "properties": {
                    "peer": {
                        "$ref": "#/components/schemas/Peer"
                    },
                    "text": {
                        "type": "string"
                    },
                    "send_type": {
                        "type": "string",
                        "enum": [
                            "TEXT",
                            "DOCUMENT",
                            "PHOTO",
                            "VIDEO",
                            "STICKER"
                        ]
                    }
                }
            },
            "Peer": {
                "type": "object",
                "required": [
                    "type",
                    "id"
                ],
                "properties": {
                    "type": {
                        "type": "string",
                        "enum": [
                            "user",
                            "chat",
                            "channel"
                        ]
                    },
                    "id": {
                        "type": "integer"
                    },
                    "access_hash": {
                        "type": "integer",
                        "nullable": true
                    }
                }
            },
            "Message": {
                "type": "object",
                "properties": {
                    "id": {
                        "type": "integer"
                    },
                    "peer": {
                        "$ref": "#/components/schemas/Peer"
                    },
                    "text": {
                        "type": "string",
                        "nullable": true
                    }
                }
            },
            "MessageResponse": {
                "type": "object",
                "properties": {
                    "message": {
                        "$ref": "#/components/schemas/Message"
                    }
                }
            },
            "LoadHistoryRequest": {
                "type": "object",
                "required": [
                    "peer"
                ],
                "properties": {
                    "peer": {
                        "$ref": "#/components/schemas/Peer"
                    },
                    "limit": {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 100
                    }
                }
            },
            "HistoryResponse": {
                "type": "object",
                "properties": {
                    "messages": {
                        "type": "array",
                        "items": {
                            "$ref": "#/components/schemas/Message"
                        }
                    }
                }
            },
            "FileUploadRequest": {
                "type": "object",
                "required": [
                    "expected_size",
                    "crc",
                    "user_id",
                    "name",
                    "mime_type"
                ],
                "properties": {
                    "expected_size": {
                        "type": "integer"
                    },
                    "crc": {
                        "type": "string"
                    },
                    "user_id": {
                        "type": "integer"
                    },
                    "name": {
                        "type": "string"
                    },
                    "mime_type": {
                        "type": "string"
                    }
                }
            },
            "FileUploadInfo": {
                "type": "object",
                "properties": {
                    "url": {
                        "type": "string",
                        "format": "uri"
                    },
                    "duplicate": {
                        "type": "boolean"
                    },
                    "file_id": {
                        "type": "integer",
                        "nullable": true
                    },
                    "chunk_size": {
                        "type": "integer",
                        "nullable": true
                    }
                }
            }
        }
    }
}
